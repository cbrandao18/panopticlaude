<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Panopticlaude · Workspace map</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/map.css">
    <script src="/map.js" defer></script>
  </head>
  <body>
    <main class="map-main">
      <header class="masthead">
        <div class="brand"><svg aria-hidden="true" viewBox="0 0 32 32"><path d="M3 16s5-9 13-9 13 9 13 9-5 9-13 9S3 16 3 16Z"/><circle cx="16" cy="16" r="4"/></svg> PANOPTICLAUDE</div>
        <a href="/" class="nav-link">Local jobs</a>
      </header>
      <section class="heading">
        <div><p class="eyebrow">ORCA WORKSPACES</p><h1>Workspace map</h1><p class="subtitle">Who's working on what, on the Mac and the VM.</p></div>
        <div class="map-controls">
          <label><input type="checkbox" id="show-idle"> Show idle over 7 days</label>
          <label><input type="checkbox" id="show-done"> Show older Runs</label>
          <button id="refresh" class="secondary">Refresh</button>
        </div>
      </section>
      <div class="connection"><span id="connection" role="status">Reading Orca…</span><span class="legend" id="legend"></span></div>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="map" class="map" aria-label="Workspace map">
        <svg id="links" class="links" aria-hidden="true"></svg>
        <div class="lane" id="lane-mac"><h2>Mac</h2><div class="lane-body"></div></div>
        <div class="lane runs" id="lane-runs"><h2>Coordinators (Runs)</h2><div class="lane-body"></div></div>
        <div class="lane" id="lane-vm"><h2>VM</h2><div class="lane-body"></div></div>
      </section>
      <footer><span>Read-only. Lines join a Run to the workspaces its workers ran in.</span><span>Refreshes every 30 seconds</span></footer>
    </main>
  </body>
</html>
