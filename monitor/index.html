<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Roost · Work</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/themes.css">
    <script src="/theme.js"></script>
    <link rel="stylesheet" href="/ticket-work.css">
    <link rel="stylesheet" href="/ease.css">
    <link rel="stylesheet" href="/brief.css">
    <link rel="stylesheet" href="/security.css">
    <link rel="stylesheet" href="/merge.css">
    <link rel="stylesheet" href="/claude-tips.css">
    <script type="module" src="/work-roost.js"></script>
    <script src="/claude-tips.js" defer></script>
    <script src="/ease.js" defer></script>
    <script src="/brief.js" defer></script>
    <script src="/security.js" defer></script>
    <script src="/merge.js" defer></script>
    <script src="/ticket-work.js" defer></script>
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div id="roost-sprite"></div>
    <main>
      <header class="masthead">
        <div class="brand"><span class="brand-mark" data-brand-mark></span> <span class="brand-name" data-brand-name>ROOST</span></div>
        <nav class="tabs" aria-label="Pages"><a href="/">Now</a><a href="/map">Map</a><a aria-current="page" href="/work"><span class="tab-bird"><svg class="bird you" aria-hidden="true"><use href="#b-call"></use></svg></span>Work</a></nav>
        <span class="local"><span class="dot"></span> On your Mac</span>
      </header>
      <div id="roost-wire"></div>
      <aside id="claude-tips" aria-label="Tip" hidden></aside>
      <section class="heading">
        <div><p class="eyebrow">WORK</p><h1>Tickets, Ease, Security and drafts</h1><p class="subtitle">Moving to the PM agent. Drafts go once assess-assumptions auto-posts.</p></div>
        <button id="refresh" class="secondary">Refresh</button>
      </section>
      <div class="connection"><span id="connection" role="status">Connecting to your jobs…</span><span id="timezone"></span></div>
      <p id="error" class="error" role="alert" hidden></p>
      <section id="brief" aria-label="Daily brief"></section>
      <section id="merge" aria-label="Ready to merge"></section>
      <section id="security" aria-label="Security tickets"></section>
      <section id="ease" aria-label="Ease and effort"></section>
      <section id="ticket-work" aria-label="GitHub ticket work"></section>
      <section id="pilot" class="job pilot" aria-label="Shared reader pilot" hidden></section>
      <section id="jobs" class="jobs" aria-label="Scheduled jobs"></section>
      <section id="viewer" class="viewer" hidden aria-label="Job details">
        <header class="viewer-heading"><div><p id="viewer-job" class="eyebrow"></p><h2 id="viewer-title"></h2></div><button id="close" class="secondary">Close</button></header>
        <div id="viewer-tools" class="viewer-tools"></div>
        <div id="viewer-content"></div>
      </section>
      <footer><span>Schedules run independently of this page.</span><span>Refreshes every 10 seconds</span></footer>
    </main>
  </body>
</html>
